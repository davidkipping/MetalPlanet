[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metalplanet"
version = "0.9.5"
description = "MetalPlanet: analytic, differentiable transit light curves on Apple Silicon (MLX), with a batman-style frontend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mlx>=0.30", "numpy"]

[project.optional-dependencies]
test = ["pytest", "scipy", "batman-package", "mpmath"]
# the sampling engine (anvil, formerly applemcmc) is an optional
# integration dependency — install it separately for metalplanet.anvil

[tool.setuptools.packages.find]
include = ["metalplanet*"]

[tool.pytest.ini_options]
markers = ["slow: long-running statistical/integration tests"]
